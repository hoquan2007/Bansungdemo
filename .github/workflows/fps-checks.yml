name: FPS checks

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'fps-next/**'
      - 'render.yaml'
      - '.github/workflows/fps-checks.yml'
  pull_request:
    paths:
      - 'fps-next/**'
      - 'render.yaml'
      - '.github/workflows/fps-checks.yml'

permissions:
  contents: read

jobs:
  fps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fps-next
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fps-next/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
